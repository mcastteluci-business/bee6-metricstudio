<!-- Placeholders: LOGO_URL, PHOTO_URL, NOME, FANTASIA_LINHA1, FANTASIA_LINHA2, CARGO_REAL, EMAIL, TELEFONE, SITE_URL, SITE_LABEL -->
<!-- Cor da marca (laranja): #ee8d49 | Fonte: Arial/Helvetica | Telefone: +55 11 XXX XXX XXX -->
<table role="presentation" cellpadding="0" cellspacing="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;width:474px;">
  <tr>
    <td colspan="2" style="padding:0 0 12px 0;">
      <img src="{{LOGO_URL}}" alt="bee6" height="30" style="display:block;border:0;height:30px;">
    </td>
  </tr>
  <tr>
    <td valign="top" align="center" style="width:104px;padding:0 16px 0 0;">
      <img src="{{PHOTO_URL}}" alt="{{NOME}}" width="82" height="82" style="display:block;border:0;border-radius:50%;">
      <div style="font-size:11px;color:#333333;font-weight:bold;padding-top:8px;line-height:1.3;">{{FANTASIA_LINHA1}}</div>
      <div style="font-size:11px;color:#ee8d49;font-weight:bold;line-height:1.3;">{{FANTASIA_LINHA2}}</div>
    </td>
    <td valign="top" style="border-left:2px solid #ee8d49;padding:0 0 0 16px;">
      <div style="font-size:17px;font-weight:bold;color:#1a1a1a;line-height:1.2;">{{NOME}}</div>
      <div style="font-size:13px;font-weight:bold;color:#ee8d49;padding-top:2px;">{{CARGO_REAL}}</div>
      <div style="font-size:12px;color:#333333;line-height:1.9;padding-top:8px;">
        <a href="mailto:{{EMAIL}}" style="color:#333333;text-decoration:none;">{{EMAIL}}</a><br>
        {{TELEFONE}}<br>
        <a href="https://{{SITE_URL}}" style="color:#ee8d49;text-decoration:none;font-weight:bold;">{{SITE_LABEL}}</a>
      </div>
    </td>
  </tr>
  <tr>
    <td colspan="2" style="padding-top:12px;">
      <div style="background:#ee8d49;color:#ffffff;font-size:12px;font-weight:bold;padding:7px 14px;border-radius:4px;">&#128029; bold &middot; BI/AI as a Service</div>
    </td>
  </tr>
</table>
